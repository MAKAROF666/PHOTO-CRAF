name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Unzip and Fix Paths
      run: |
        if [ -f "PhotoCraft-Android-Project.zip" ]; then
          unzip -o PhotoCraft-Android-Project.zip -d extracted_project
        elif [ -f "PhotoCraft-Android.zip" ]; then
          unzip -o PhotoCraft-Android.zip -d extracted_project
        fi
        
        # Move files to root if they are inside a subfolder
        if [ -d "extracted_project/PhotoCraft-Android" ]; then
          cp -r extracted_project/PhotoCraft-Android/* .
        elif [ -d "extracted_project" ]; then
          cp -r extracted_project/* .
        fi
        
        mkdir -p app/src/main/assets
        if [ -f "photocraft-mobile.html" ]; then
          cp photocraft-mobile.html app/src/main/assets/
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradle executable
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: PhotoCraft-APK
        path: app/build/outputs/apk/debug/app-debug.apk
