name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Unzip and Fix Paths
      run: |
        # البحث عن أي ملف مضغوط في المستودع وفك ضخه
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_project
        fi
        
        # نقل الملفات للمسار الرئيسي إذا كانت داخل مجلد فرعي
        if [ -d "extracted_project" ]; then
          SUBDIR=$(find extracted_project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$SUBDIR" ]; then
            cp -r "$SUBDIR"/* . 2>/dev/null || true
          fi
          cp -r extracted_project/* . 2>/dev/null || true
        fi
        
        # وضع ملف الـ HTML في مجلد الأصول إذا وجد
        mkdir -p app/src/main/assets
        HTML_FILE=$(find . -maxdepth 1 -name "*.html" | head -n 1)
        if [ -n "$HTML_FILE" ]; then
          cp "$HTML_FILE" app/src/main/assets/
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradle executable
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PhotoCraft-APK
        path: app/build/outputs/apk/debug/app-debug.apk
