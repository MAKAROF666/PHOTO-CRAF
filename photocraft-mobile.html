if(v=='all'||v=='none'||v=='sel'){if(v=='sel'&&!selM){toast('لا يوجد تحديد');return}l.m=newMask(v);editMask=true;draw();commit('إضافة قناع')}
else if(v=='del'){l.m=null;editMask=false;draw();commit('حذف القناع')}
else if(v=='inv'&&l.m){const c=mk(W,H),g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.globalCompositeOperation='destination-out';g.drawImage(l.m,0,0);l.m=c;draw();commit('عكس القناع')}
else if(v=='apply'&&l.m){if(l.t=='adj'){toast('لا يمكن تطبيق قناع على طبقة ضبط');return}rasterize(l);l.c=cl(l.c);const g=l.c.getContext('2d');g.globalCompositeOperation='destination-in';g.drawImage(l.m,0,0);l.m=null;editMask=false;draw();commit('تطبيق القناع')}}
function dlgNew(){const P=[['1080×1080','1080,1080'],['1080×1350','1080,1350'],['1080×1920','1080,1920'],['1920×1080','1920,1080'],['2048×1536','2048,1536']];
dialog('مستند جديد',`<div class="btns">${P.map(([n,v])=>`<button class="chip" data-p="${v}">${n}</button>`).join('')}</div><div class="fr"><span>العرض</span><input type="number" id="nw" value="1080" min="16" max="${MAXD}"></div><div class="fr"><span>الارتفاع</span><input type="number" id="nh" value="1080" min="16" max="${MAXD}"></div><div class="fr"><span>الخلفية</span><select id="nb"><option value="white">أبيض</option><option value="black">أسود</option><option value="none">شفافة</option></select></div>`,[['إلغاء'],['إنشاء',()=>{newDoc(clamp(+$('#nw').value||1080,16,MAXD),clamp(+$('#nh').value||1080,16,MAXD),$('#nb').value);dockOpen=false;ui()},1]]);
$$('[data-p]').forEach(b=>b.onclick=()=>{const[w,h]=b.dataset.p.split(',');$('#nw').value=w;$('#nh').value=h})}
function dlgSize(){const r=W/H;dialog('حجم الصورة',`<div class="fr"><span>العرض</span><input type="number" id="iw" value="${W}"></div><div class="fr"><span>الارتفاع</span><input type="number" id="ih" value="${H}"></div><div class="fr"><span>نسبة ثابتة</span><input type="checkbox" id="ir" checked></div>`,[['إلغاء'],['تطبيق',()=>{const w=clamp(+$('#iw').value|0,16,MAXD),h=clamp(+$('#ih').value|0,16,MAXD);resizeDoc(w,h)},1]]);
$('#iw').oninput=()=>{if($('#ir').checked)$('#ih').value=Math.round($('#iw').value/r)};$('#ih').oninput=()=>{if($('#ir').checked)$('#iw').value=Math.round($('#ih').value*r)}}
function dlgFeather(){dialog('ريش التحديد',`<div class="rg"><span>نصف القطر</span><input type="range" id="fr" min="1" max="60" value="8" style="flex:1"><b id="fv">8</b></div>`,[['إلغاء'],['تطبيق',()=>{if(!selM){toast('لا يوجد تحديد');return}const r=+$('#fr').value,d=selM.getContext('2d').getImageData(0,0,W,H);blur(d,r);const c=mk(W,H);c.getContext('2d').putImageData(d,0,0);setSel(c,'ريش')},1]]);$('#fr').oninput=e=>$('#fv').textContent=e.target.value}
async function exportImg(fmt){if(!W)return;let c=cv;if(fmt=='jpg'){c=mk(W,H);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.drawImage(cv,0,0)}
const mime=fmt=='png'?'image/png':'image/jpeg',b=await new Promise(r=>c.toBlob(r,mime,.92)),name='PhotoCraft-'+Date.now()+'.'+fmt;
if(window.AndroidBridge){const fr=new FileReader();fr.onload=()=>{const ok=AndroidBridge.save(fr.result.split(',')[1],name,mime);toast(ok?'تم الحفظ في معرض الصور ✓':'تعذر الحفظ')};fr.readAsDataURL(b);return}
try{const f=new File([b],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name=='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('تم التصدير ✓')}
function runAct(a,v,w){if(!W&&!['new','open','about','menu','mi','tool','dtab'].includes(a))return;
switch(a){
case'menu':openMenu(v);break;
case'mi':closePop();runAct(v,w);break;
case'tool':setTool(v);break;
case'opt':{const[p,val]=v.split(':'),[t,k]=p.split('.');T[t][k]=isNaN(val)?val:+val;ui();break}
case'ratio':T.crop.ratio=v;crFit();crShow();ui();break;
case'cropok':applyCrop();break;case'cropno':setTool('move');break;
case'cropsel':if(!selM)toast('لا يوجد تحديد');else{const d=selM.getContext('2d').getImageData(0,0,W,H).data;let x0=W,y0=H,x1=0,y1=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]>127){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}cropDoc(x0,y0,x1-x0+1,y1-y0+1);selM=null;edge=null;drawAnts();commit('قص إلى التحديد')}break;
case'undo':undo();break;case'redo':redo();break;case'jump':jump(+v);break;
case'new':closePop();dlgNew();break;
case'open':closePop();fmode='open';$('#fi').click();break;
case'addimg':closePop();fmode='add';$('#fi').click();break;
case'exp':exportImg(v);break;
case'fill':fillSel(v=='fg'?fg:bgc);break;case'clear':clearSel();break;
case'swap':[fg,bgc]=[bgc,fg];swatches();break;case'defcol':fg='#000000';bgc='#ffffff';swatches();break;
case'imgsize':dlgSize();break;case'rot':if(v=='180'){rot90(true);rot90(true)}else rot90(v=='cw');break;case'flip':flipDoc(v=='h');break;case'flatten':flatten();break;
case'newl':addL({t:'paint',n:'طبقة '+(++nameN),c:mk(W,H)});draw();commit('طبقة جديدة');break;
case'dup':if(act){const n={...act,id:uid++,n:act.n+' نسخة',p:cp(act.p),fx:cp(act.fx)};if(n.c)n.c=cl(n.c);if(n.m)n.m=cl(n.m);L.splice(L.indexOf(act)+1,0,n);act=n;draw();commit('تكرار الطبقة')}break;
case'del':if(act){const i=L.indexOf(act);L=L.filter(l=>l!==act);act=L[Math.min(i,L.length-1)]||null;editMask=false;draw();commit('حذف الطبقة')}break;
case'up':case'dn':{const i=L.indexOf(act),j=i+(a=='up'?1:-1);if(act&&j>=0&&j<L.length){[L[i],L[j]]=[L[j],L[i]];draw();commit('ترتيب الطبقات')}break}
case'merge':mergeDown();break;case'sel2l':selToLayer();break;
case'mask':maskOp(v||w);break;case'maskbtn':maskOp(selM?'sel':'all');break;
case'maskedit':{const l=L.find(x=>x.id==v);if(l){if(act===l&&l.m)editMask=!editMask;else{act=l;editMask=!!l.m}ui()}break}
case'sel':act=L.find(l=>l.id==v);editMask=false;ui();break;
case'vis':{const l=L.find(x=>x.id==v);l.v=l.v?0:1;draw();commit(l.v?'إظهار الطبقة':'إخفاء الطبقة');break}
case'selall':setSel(maskFromPath(g=>g.fillRect(0,0,W,H)),'تحديد الكل');break;
case'desel':if(selM)setSel(null,'إلغاء التحديد');break;
case'selinv':{const c=mk(W,H),g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);if(selM){g.globalCompositeOperation='destination-out';g.drawImage(selM,0,0)}setSel(c,'عكس التحديد');break}
case'feather':dlgFeather();break;
case'adj':addAdj(v);break;case'pre':addAdj('pre',v);break;case'tabadj':dTab='adj';dockOpen=true;ui();break;
case'newtext':setTool('text');toast('اضغط على الصورة لإضافة نص');break;
case'fit':zoomed=false;fit();break;case'z100':{const r=stage.getBoundingClientRect();zoomAt(1,r.width/2,r.height/2);break}
case'zin':case'zout':{const r=stage.getBoundingClientRect();zoomAt(view.k*(a=='zin'?1.5:.67),r.width/2,r.height/2);break}
case'about':dialog('فوتو كرافت للجوال','<p style="line-height:1.7;margin:0">محرر صور للهاتف مستوحى من تطبيق PhotoCraft مفتوح المصدر (MIT / Apache-2.0): طبقات، أقنعة، تحديدات، طبقات ضبط غير مدمِّرة، منحنيات، أنماط طبقات ونصوص.</p>',[['إغلاق',null,1]]);break;
case'dtab':if(dTab==v&&dockOpen&&!landscape())dockOpen=false;else{dTab=v;dockOpen=true}ui();break;
case'col':pickColor(getK(v),c=>{setK(v,c);q();const b=$(`[data-v="${v}"].sw`);if(b)b.style.background=c},()=>{commit('تغيير اللون');ui()});break;
case'colfg':pickColor(fg,c=>{fg=c;swatches()});break;case'colbg':pickColor(bgc,c=>{bgc=c;swatches()});break;
case'fxt':{const l=act;l.fx=l.fx||{};if(!l.fx[v])l.fx[v]=cp(FXD[v]);else l.fx[v].on=l.fx[v].on?0:1;draw();commit('نمط الطبقة');break}
case'cch':cch=v;ui();break;
case'aisend':aiRun($('#aiq')?$('#aiq').value:aiDraft);break;case'aiex':aiRun(v);break;case'aiset':aiDialog();break;
case'cureset':act.p.cv[cch]=[[0,0],[255,255]];q();commit('إعادة ضبط المنحنى');break}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){e.stopPropagation();runAct(t.dataset.a,t.dataset.v,t.dataset.w)}else if(!e.target.closest('#pop'))closePop()});
function onField(e,end){const t=e.target,k=t.dataset.k;if(!k||!t.isConnected)return;if(k.startsWith('T.')){if(t.type=='range'){setK(k,+t.value);t.nextElementSibling.textContent=t.value+(k.endsWith('.hard')||k.endsWith('.op')?'%':'')}return}
if(!act)return;const v=t.type=='checkbox'?+t.checked:t.type=='range'?+t.value:t.value;setK(k,v);
if(t.type=='range'){const dv=(ADJ[act.kind]&&ADJ[act.kind].sl.find(s=>'p.'+s[0]==k)||[])[5]||1;t.nextElementSibling.textContent=k=='o'?v+'%':dv>1?(v/dv).toFixed(2):Math.round(v)}
if(k=='n'||k=='lk'){if(end){commit('تعديل');}return}
q();if(end){commit(k=='bm'?'وضع المزج':k=='o'?'الشفافية':k=='p.tx'?'تحرير النص':'تعديل الخصائص');if(t.type!='range'&&t.type!='textarea')ui()}}
document.addEventListener('input',e=>onField(e,false));document.addEventListener('change',e=>onField(e,true));
/* ---------- files ---------- */
let fmode='open';
$('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const c=await loadImg(f);if(fmode=='open'||!W){openImage(c,f.name);dockOpen=false;dTab='adj';ui()}else{addImageLayer(c,f.name.replace(/\.[^.]+$/,''))}}catch(err){toast('تعذر فتح الصورة')}};
/* ---------- keys (desktop) & back ---------- */
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
if((e.ctrlKey||e.metaKey)&&k=='z'){e.preventDefault();e.shiftKey?redo():undo();return}
const map={v:'move',m:'mq',l:'lasso',w:'wand',c:'crop',i:'eye',b:'brush',e:'eraser',g:'grad',k:'bucket',t:'text',u:'shape',h:'hand',z:'zoom'};
if(map[k]&&!e.ctrlKey&&!e.metaKey)setTool(map[k]);else if(k=='x'){[fg,bgc]=[bgc,fg];swatches()}else if(k=='d'){fg='#000000';bgc='#ffffff';swatches()}
else if(k=='delete'||k=='backspace'){if(selM)clearSel()}else if(k=='['||k==']'){const o=T[tool];if(o&&o.size){o.size=clamp(Math.round(o.size*(k=='['?.8:1.25)),1,300);ui()}}});
window.onBack=()=>{if($('#dlg').style.display=='flex'){closeDlg();return true}if($('#pop').style.display=='block'){closePop();return true}if(tool=='crop'){setTool('move');return true}if(dockOpen&&!landscape()){dockOpen=false;ui();return true}return false};
/* ---------- init ---------- */
$('#doc').style.width='0px';ui();

</script></body></html>
